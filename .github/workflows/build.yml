name: Build APK

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check signing key
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Add the KEYSTORE_PASSWORD secret first"
            exit 1
          fi
          if [ ! -f app/rams.p12 ]; then
            echo "app/rams.p12 is missing. Upload your saved rams.p12 into the app folder."
            exit 1
          fi

      - name: Build APK
        run: gradle assembleDebug
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/rams.p12

      - name: Show signing fingerprint
        continue-on-error: true
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/debug/*.apk | grep -i "SHA-256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rams-editor-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rams Editor 1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk