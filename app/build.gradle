plugins {
id 'com.android.application'
id 'org.jetbrains.kotlin.android'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
namespace 'com.rams.editor'
compileSdk 34

defaultConfig {
applicationId "com.rams.editor"
minSdk 21
targetSdk 34
versionCode runNumber
versionName "1.0.${runNumber}"
}

signingConfigs {
rams {
def ksPath = System.getenv("KEYSTORE_PATH")
if (ksPath) {
storeFile file(ksPath)
storeType "pkcs12"
storePassword System.getenv("KEYSTORE_PASSWORD")
keyAlias "rams"
keyPassword System.getenv("KEYSTORE_PASSWORD")
}
}
}

buildTypes {
debug {
minifyEnabled false
if (System.getenv("KEYSTORE_PATH")) {
signingConfig signingConfigs.rams
}
}
}

compileOptions {
coreLibraryDesugaringEnabled true
sourceCompatibility JavaVersion.VERSION_17
targetCompatibility JavaVersion.VERSION_17
}

packaging {
resources {
excludes += [
'META-INF/DEPENDENCIES',
'META-INF/LICENSE',
'META-INF/LICENSE.txt',
'META-INF/NOTICE',
'META-INF/NOTICE.txt',
'META-INF/INDEX.LIST'
]
}
}
}

kotlin {
compilerOptions {
jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
}
}

dependencies {
implementation 'androidx.appcompat:appcompat:1.6.1'
implementation 'androidx.core:core-ktx:1.12.0'
implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
implementation 'androidx.recyclerview:recyclerview:1.3.0'
implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
implementation 'io.github.Rosemoe.sora-editor:editor:0.23.6'

// Git
implementation 'org.eclipse.jgit:org.eclipse.jgit:5.13.5.202508271544-r'
coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}